[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleicounter"
version = "2024.04.30"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-image",
    "opencv-python",
    "tifffile",
    "tk"
] 

[tool.setuptools]
packages = ["nucleicounter"]